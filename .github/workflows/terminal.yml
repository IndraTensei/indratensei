name: Generate Terminal GIF

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade github-readme-terminal

      - name: Generate terminal GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate_terminal.py

      - name: Commit and push terminal.gif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          GIF_PATH=$(find . -name 'output.gif' -not -path './.git/*' -print -quit)
          if [ -z "$GIF_PATH" ]; then
            echo "output.gif not found" >&2
            exit 1
          fi
          mv "$GIF_PATH" terminal.gif
          git add terminal.gif
          git diff --staged --quiet || git commit -m "Update terminal GIF [skip ci]"
          git push
